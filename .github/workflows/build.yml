name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Project from Base64
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/example/screenoffauto

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          echo "" | base64 -d > app/src/main/res/xml/accessibility_service_config.xml

          echo "" | base64 -d > app/src/main/java/com/example/screenoffauto/MainActivity.kt

          echo "" | base64 -d > app/src/main/java/com/example/screenoffauto/ScreenOffService.kt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOffAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
