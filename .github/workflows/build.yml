name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Clean Project
        run: |
          python3 -c '
          import os, base64
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/java/com/example/screenoffauto", exist_ok=True)

          manifest = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<manifest xmlns:android=\"http://android.com" + "android\">\n"
              "    <uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n"
              "    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n"
              "    <application android:allowBackup=\"false\" android:label=\"ScreenOff\" android:theme=\"@android:style/Theme.Translucent.NoTitleBar\">\n"
              "        <activity android:name=\".MainActivity\" android:exported=\"true\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.intent.action.MAIN\" />\n"
              "                <category android:name=\"android.intent.category.LAUNCHER\" />\n"
              "                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />\n"
              "            </intent-filter>\n"
              "        </activity>\n"
              "        <service android:name=\".ScreenOffService\" android:exported=\"true\" android:permission=\"android.permission.BIND_ACCESSIBILITY_SERVICE\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.accessibilityservice.AccessibilityService\" />\n"
              "            </intent-filter>\n"
              "            <meta-data android:name=\"android.accessibilityservice\" android:resource=\"@xml/accessibility_service_config\" />\n"
              "        </service>\n"
              "    </application>\n"
              "</manifest>\n"
          )

          xml_cfg = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<accessibility-service xmlns:android=\"http://android.com" + "android\"\n"
              "    android:accessibilityEventTypes=\"typeWindowStateChanged\"\n"
              "    android:accessibilityFeedbackType=\"feedbackGeneric\"\n"
              "    android:canPerformGestures=\"true\"\n"
              "    android:canRetrieveWindowContent=\"true\"\n"
              "    android:description=\"ScreenOff Auto\"\n"
              "    android:notificationTimeout=\"100\" />\n"
          )

          main_kt = """package com.example.screenoffauto

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val service = ScreenOffService.instance
                  if (service == null) {
                      Toast.makeText(this, "Enable ScreenOff in Accessibility", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  } else {
                      startActivity(Intent(Settings.ACTION_SETTINGS).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                      service.runMacro()
                  }
                  finish()
              }
          }
          """

          service_kt = """package com.example.screenoffauto

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ScreenOffService : AccessibilityService() {
              companion object {
                  var instance: ScreenOffService? = null
              }
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun runMacro() {
                  handler.postDelayed({
                      moveDownAndClick(4)
                      handler.postDelayed({
                          moveDownAndClick(6)
                          handler.postDelayed({
                              moveDownAndClick(1)
                          }, 600)
                      }, 600)
                  }, 1200)
              }

              private fun moveDownAndClick(steps: Int) {
                  val root = rootInActiveWindow ?: return
                  var currentFocus = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  for (i in 0 until steps) {
                      val next = currentFocus?.focusSearch(View.FOCUS_DOWN)
                      if (next != null) {
                          next.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          currentFocus = next
                      }
                  }
                  currentFocus?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }
          }
          """

          with open("app/src/main/AndroidManifest.xml", "w") as f: f.write(manifest)
          with open("app/src/main/res/xml/accessibility_service_config.xml", "w") as f: f.write(xml_cfg)
          with open("app/src/main/java/com/example/screenoffauto/MainActivity.kt", "w") as f: f.write(main_kt)
          with open("app/src/main/java/com/example/screenoffauto/ScreenOffService.kt", "w") as f: f.write(service_kt)
          '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOffAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
