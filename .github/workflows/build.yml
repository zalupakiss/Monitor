name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Smart Self-Disabling Project
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/screenoffauto

          echo "PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iZGVzYyI+U2NyZWVuT2ZmIEF1dG88L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==" | base64 -d > app/src/main/res/values/strings.xml

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          echo "" | base64 -d > app/src/main/res/xml/accessibility_service_config.xml

          cat << 'EOF' > app/src/main/java/com/example/screenoffauto/MainActivity.kt
          package com.example.screenoffauto

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      val myService = ComponentName(this, ScreenOffService::class.java).flattenToString()
                      val current = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val updated = if (current.isEmpty()) myService else if (!current.contains(myService)) "$current:$myService" else current

                      Settings.Secure.putString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, updated)
                      Settings.Secure.putInt(contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 1)

                      startActivity(Intent(Settings.ACTION_SETTINGS).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                  } catch (e: SecurityException) {
                      Toast.makeText(this, "Grant WRITE_SECURE_SETTINGS in App Manager", Toast.LENGTH_LONG).show()
                  }
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/screenoffauto/ScreenOffService.kt
          package com.example.screenoffauto

          import android.accessibilityservice.AccessibilityService
          import android.content.ComponentName
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ScreenOffService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var executed = false

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (!executed) {
                      executed = true
                      runMacroAndSelfDisable()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun runMacroAndSelfDisable() {
                  handler.postDelayed({
                      moveDownAndClick(4)
                      handler.postDelayed({
                          moveDownAndClick(6)
                          handler.postDelayed({
                              moveDownAndClick(1)
                              handler.postDelayed({
                                  stopAndCleanSelf()
                              }, 300)
                          }, 300)
                      }, 300)
                  }, 700)
              }

              private fun stopAndCleanSelf() {
                  try {
                      val myService = ComponentName(this, ScreenOffService::class.java).flattenToString()
                      val current = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val cleaned = current.split(":").filter { it.isNotEmpty() && it != myService }.joinToString(":")
                      Settings.Secure.putString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, cleaned)
                  } catch (e: Exception) {}
                  disableSelf()
              }

              private fun moveDownAndClick(steps: Int) {
                  val root = rootInActiveWindow ?: return
                  var currentFocus = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  for (i in 0 until steps) {
                      val next = currentFocus?.focusSearch(View.FOCUS_DOWN)
                      if (next != null) {
                          next.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          currentFocus = next
                      }
                  }
                  currentFocus?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOffAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
