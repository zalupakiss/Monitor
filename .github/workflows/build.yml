name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack Smart Self-Disabling Project
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/screenoffauto

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="desc">ScreenOff Auto</string>
          </resources>
          EOF

          python3 -c '
          import os
          manifest = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<manifest xmlns:android=\"http://android.com" + "android\">\n"
              "    <uses-permission android:name=\"android.permission.WRITE_SECURE_SETTINGS\" />\n"
              "    <uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n"
              "    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n"
              "    <application android:allowBackup=\"false\" android:label=\"ScreenOff\" android:theme=\"@android:style/Theme.Translucent.NoTitleBar\">\n"
              "        <activity android:name=\".MainActivity\" android:exported=\"true\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.intent.action.MAIN\" />\n"
              "                <category android:name=\"android.intent.category.LAUNCHER\" />\n"
              "                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />\n"
              "            </intent-filter>\n"
              "        </activity>\n"
              "        <service android:name=\".ScreenOffService\" android:exported=\"true\" android:permission=\"android.permission.BIND_ACCESSIBILITY_SERVICE\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.accessibilityservice.AccessibilityService\" />\n"
              "            </intent-filter>\n"
              "            <meta-data android:name=\"android.accessibilityservice\" android:resource=\"@xml/accessibility_service_config\" />\n"
              "        </service>\n"
              "    </application>\n"
              "</manifest>\n"
          )

          xml_cfg = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<accessibility-service xmlns:android=\"http://android.com" + "android\"\n"
              "    android:accessibilityEventTypes=\"typeWindowStateChanged\"\n"
              "    android:accessibilityFeedbackType=\"feedbackGeneric\"\n"
              "    android:canPerformGestures=\"true\"\n"
              "    android:canRetrieveWindowContent=\"true\"\n"
              "    android:description=\"@string/desc\"\n"
              "    android:notificationTimeout=\"100\" />\n"
          )

          main_kt = """package com.example.screenoffauto

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      val myService = ComponentName(this, ScreenOffService::class.java).flattenToString()
                      val current = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val updated = if (current.isEmpty()) myService else if (!current.contains(myService)) "$current:$myService" else current

                      Settings.Secure.putString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, updated)
                      Settings.Secure.putInt(contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 1)

                      startActivity(Intent(Settings.ACTION_SETTINGS).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                  } catch (e: SecurityException) {
                      Toast.makeText(this, "Выдайте WRITE_SECURE_SETTINGS в App Manager", Toast.LENGTH_LONG).show()
                  }
                  finish()
              }
          }
          """

          service_kt = """package com.example.screenoffauto

          import android.accessibilityservice.AccessibilityService
          import android.content.ComponentName
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ScreenOffService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var executed = false

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (!executed) {
                      executed = true
                      runMacroAndSelfDisable()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun runMacroAndSelfDisable() {
                  handler.postDelayed({
                      moveDownAndClick(4)
                      handler.postDelayed({
                          moveDownAndClick(6)
                          handler.postDelayed({
                              moveDownAndClick(1)
                              handler.postDelayed({
                                  disableSelf()
                              }, 300)
                          }, 300)
                      }, 300)
                  }, 700)
              }

              private fun disableSelf() {
                  try {
                      val myService = ComponentName(this, ScreenOffService::class.java).flattenToString()
                      val current = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val cleaned = current.split(":").filter { it.isNotEmpty() && it != myService }.joinToString(":")
                      Settings.Secure.putString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, cleaned)
                  } catch (e: Exception) {}
                  disableSelf()
              }

              private fun moveDownAndClick(steps: Int) {
                  val root = rootInActiveWindow ?: return
                  var currentFocus = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  for (i in 0 until steps) {
                      val next = currentFocus?.focusSearch(View.FOCUS_DOWN)
                      if (next != null) {
                          next.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          currentFocus = next
                      }
                  }
                  currentFocus?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }
          }
          """

          with open("app/src/main/AndroidManifest.xml", "w") as f: f.write(manifest)
          with open("app/src/main/res/xml/accessibility_service_config.xml", "w") as f: f.write(xml_cfg)
          with open("app/src/main/java/com/example/screenoffauto/MainActivity.kt", "w") as f: f.write(main_kt)
          with open("app/src/main/java/com/example/screenoffauto/ScreenOffService.kt", "w") as f: f.write(service_kt)
          '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOffAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
